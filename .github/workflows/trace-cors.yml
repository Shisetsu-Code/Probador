name: Trace official demo CORS
on:
  push:
    branches: [main]
    paths: ['trace_cors.py', '.github/workflows/trace-cors.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m py_compile trace_cors.py
      - run: python trace_cors.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: official-cors-trace
          path: results/cors_trace.json
          if-no-files-found: warn
